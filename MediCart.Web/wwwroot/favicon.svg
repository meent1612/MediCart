<svg viewBox="-2 -38 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3f54"/>
      <stop offset="100%" stop-color="#2D3142"/>
    </linearGradient>
    <linearGradient id="cartGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F1F5"/>
      <stop offset="100%" stop-color="#D8D5DB"/>
    </linearGradient>

    <style>
      .cart-fill { fill: url(#cartGrad); }
      .cart-stroke { stroke: url(#cartGrad); }
      .rib-stroke { stroke: #2D3142; stroke-opacity: 0.35; }
      @media (prefers-color-scheme: dark) {
        .cart-fill { fill: url(#cartGradDark); }
        .cart-stroke { stroke: url(#cartGradDark); }
        .rib-stroke { stroke: #F3F1F5; stroke-opacity: 0.45; }
      }
    </style>

    <!-- mask that knocks a true transparent plus/cross out of the basket -->
    <mask id="crossKnockoutFavicon">
      <rect x="-50" y="-50" width="420" height="420" fill="white"/>
      <g transform="translate(200,155)">
        <rect x="-11" y="-45" width="22" height="90" rx="6" fill="black"/>
        <rect x="-45" y="-11" width="90" height="22" rx="6" fill="black"/>
      </g>
    </mask>
  </defs>

  <g mask="url(#crossKnockoutFavicon)">
    <!-- basket -->
    <path class="cart-fill" d="M100 90 L300 90 L272 220 L128 220 Z"/>
    <!-- handle -->
    <path class="cart-stroke" d="M40 60 L90 60 L108 90" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- front guard bar -->
    <path class="cart-stroke" d="M40 60 L24 32" fill="none" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- basket ribs -->
  <line x1="150" y1="102" x2="140" y2="208" class="rib-stroke" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="102" x2="260" y2="208" class="rib-stroke" stroke-width="5" stroke-linecap="round"/>
</svg>
